<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INDRA — National Weather Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 14.5A4.5 4.5 0 0 1 7.5 5.7 5.5 5.5 0 0 1 18 7.5a4 4 0 0 1-.7 7.95" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M12 3v2.2M12 3l1.4 1.6M12 3l-1.4 1.6" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">INDRA</div>
        <div class="brand-subtitle">National Weather Intelligence Platform</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="nav-item active" data-page="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 12 12 4l8 8M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-page="map">
        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 21s7-6.4 7-11.5A7 7 0 0 0 5 9.5C5 14.6 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
        Live Map
      </button>
      <button class="nav-item" data-page="events">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 10h16M9 4v6" stroke="currentColor" stroke-width="1.8"/></svg>
        Events
      </button>
      <button class="nav-item" data-page="reports">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M9 12h6M9 16h6M9 8h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Reports
      </button>
      <button class="nav-item" data-page="analytics">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Analytics
      </button>
      <button class="nav-item" data-page="alerts">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3v3M12 21a2.2 2.2 0 0 0 2-1.3H10A2.2 2.2 0 0 0 12 21Z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M5.5 16.5C5 17 5 18 6 18h12c1 0 1-1 .5-1.5C17.7 15.7 17 14 17 10.5 17 7.5 14.8 5 12 5S7 7.5 7 10.5c0 3.5-.7 5.2-1.5 6Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
        Alerts
      </button>
      <button class="nav-item" data-page="datasets">
        <svg class="nav-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M5 6v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 12v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-6" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        Datasets
      </button>
      <button class="nav-item" data-page="admin">
        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5M16 11c1.8 0 3.3-1.4 3.3-3.2S17.8 4.5 16 4.5M21 20c0-2.3-1.9-4.2-4.3-4.8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        Admin Panel
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="footer-emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.2"/><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1"/></svg>
      </div>
      <p>Building a<br>Safer &amp; Weather-Ready<br>India</p>
      <div class="footer-version">v1.0.0 — Team Sixth Sense</div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M20 20l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="global-search" type="text" placeholder="Search location, event or report..." />
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="notif-btn" title="Alerts">
          <svg viewBox="0 0 24 24" width="19" height="19"><path d="M5.5 16.5C5 17 5 18 6 18h12c1 0 1-1 .5-1.5C17.7 15.7 17 14 17 10.5 17 7.5 14.8 5 12 5S7 7.5 7 10.5c0 3.5-.7 5.2-1.5 6Z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="M12 3v3" stroke="currentColor" stroke-width="1.7"/></svg>
          <span class="notif-dot" id="notif-dot"></span>
        </button>
        <div class="team-chip">
          <div class="team-avatar">SS</div>
          <div class="team-text">
            <div class="team-name">Sixth Sense</div>
            <div class="team-role">Team</div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-container" id="page-container">
      <!-- pages are rendered here by js/app.js -->
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="js/api.js"></script>
<script src="js/ws.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/map.js"></script>
<script src="js/pages/events.js"></script>
<script src="js/pages/investigation.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/analytics.js"></script>
<script src="js/pages/alerts.js"></script>
<script src="js/pages/datasets.js"></script>
<script src="js/pages/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
